# Build the Vault container image (with the web UI) and push it to Amazon ECR
# on every merge to main.
#
# Required repository variable:
#   AWS_ECR_ROLE_ARN  - IAM role assumed via GitHub OIDC with push access to the repository
name: ecr-push

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Required to assume the AWS role via OIDC

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: tokenengine/vault

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/set-up-go
      - uses: ./.github/actions/set-up-pnpm
      - name: Build web UI
        run: make ci-build-ui
      - name: Build Vault binary
        env:
          BIN_PATH: dist/linux/amd64/
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GO_TAGS: ui
          REMOVE_SYMBOLS: "1"
          SKIP_GEN: "1"
        run: make ci-build
      - id: metadata
        name: Collect build metadata
        run: |
          {
            echo "version=$(cat version/VERSION)"
            echo "revision=$(make ci-get-revision)"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: default
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            BIN_NAME=vault
            PRODUCT_VERSION=${{ steps.metadata.outputs.version }}
            PRODUCT_REVISION=${{ steps.metadata.outputs.revision }}
            LICENSE_SOURCE=LICENSE
            LICENSE_DEST=/usr/share/doc/vault/LICENSE.txt
          cache-from: type=gha
          cache-to: type=gha,mode=max
